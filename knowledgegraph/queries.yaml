test: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX owl: <http://www.w3.org/2002/07/owl#>
  PREFIX hasConcept: <http://example.org/hasConcept#>
  PREFIX domain: <http://example.org/domain#>
  PREFIX cs: <http://example.org/conceptual_space#>
  PREFIX onto: <http://example.org/emotions#>

  SELECT DISTINCT ?emotion ?emotion_label ?emotion_definition
                  ?dimension ?dimension_label ?dimension_definition
  WHERE {
    ?emotion rdf:type onto:Emotion .
    OPTIONAL { ?emotion rdfs:label ?emotion_label . }
    OPTIONAL { ?emotion rdfs:comment ?emotion_definition . }

    # Connect Emotion → ConceptualSpace → QualityDimension
    ?cs rdf:type cs:ConceptualSpace .
    ?cs hasConcept:hasConcept onto:Emotions .
    ?cs domain:hasDomain ?dimension .

    OPTIONAL { ?dimension rdfs:label ?dimension_label . }
    OPTIONAL { ?dimension rdfs:comment ?dimension_definition . }
  }


get_all_individuals: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

  SELECT DISTINCT ?individual ?type ?label
  WHERE {
    ?individual rdf:type ?type .
    OPTIONAL { ?individual rdfs:label ?label . }
  }
  LIMIT 50